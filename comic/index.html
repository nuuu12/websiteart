<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cereal</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow-y: scroll;
    }

    h1 {
      text-align: center;
    }

    .nav {
      width: 100%;
      text-align: center;
      font-size: 24px;
      line-height: 1;
      margin: 20px 0;
    }

    .nav a,
    .nav span {
      display: inline-block;
      width: 2em;
      text-align: center;
    }

    .nav span.disabled {
      color: gray;
      text-decoration: line-through;
    }

    .page-number {
      margin: 0 20px;
      display: inline-block;
    }

    #comicContainer {
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    /* Default comic image style */
    #comicImage {
      display: block;
      margin: 0 auto;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 80vh;
      user-select: none;
    }

    /* Page-specific overrides */
	body[data-page="7"] #comicImage {
		  max-height: 400vh;
		  <!--width: 1000px;
		  height: auto;-->
	}


    .home {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1></h1>

  <!-- Top navigation -->
  <div class="nav" id="navTop"></div>

  <!-- Comic image -->
  <div id="comicContainer">
    <img id="comicImage" src="" alt="Comic page">
  </div>

  <!-- Bottom navigation -->
  <div class="nav" id="navBottom"></div>

  <div class="home"><a href="https://www.saghaley.com">Home</a></div>

  <script>
    const totalPages = 7;
    const imagePrefix = "comic";
    const imageExt = ".webp";

    function getPageNumber() {
      const hash = window.location.hash.substring(1);
      const num = parseInt(hash);
      return (num >= 1 && num <= totalPages) ? num : 1;
    }

    function updatePage() {
      const page = getPageNumber();
      document.body.setAttribute("data-page", page);

      const img = document.getElementById("comicImage");
      img.src = `${imagePrefix}${page}${imageExt}`;

      const backLink = page === 1
        ? `<span class="disabled">←</span>`
        : `<a href="#${page - 1}">←</a>`;

      const nextLink = page === totalPages
        ? `<span class="disabled">→</span>`
        : `<a href="#${page + 1}">→</a>`;

      const pageDisplay = `<span class="page-number">${page}</span>`;
      const navHTML = `${backLink}${pageDisplay}${nextLink}`;

      document.getElementById("navTop").innerHTML = navHTML;
      document.getElementById("navBottom").innerHTML = navHTML;
    }

    function handleArrowKeyNav(e) {
      const currentPage = getPageNumber();
      if (e.key === "ArrowRight" && currentPage < totalPages) {
        location.hash = `#${currentPage + 1}`;
      } else if (e.key === "ArrowLeft" && currentPage > 1) {
        location.hash = `#${currentPage - 1}`;
      }
    }

    window.addEventListener("hashchange", updatePage);
    window.addEventListener("load", updatePage);
    window.addEventListener("keydown", handleArrowKeyNav);
  </script>
</body>
</html>
