<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cereal</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: auto;
    }

    html {
      overflow-y: scroll; /* always show vertical scrollbar */
    }

    h1 {
      text-align: center;
    }

    .nav {
      width: 100%;
      text-align: center;
      font-size: 24px;
      line-height: 1;
      margin: 20px 0;
    }

    .nav a,
    .nav span {
      display: inline-block;
      width: 2em;
      text-align: center;
    }

    .nav span.disabled {
      color: gray;
      text-decoration: line-through;
    }

    .page-number {
      margin: 0 20px;
      display: inline-block;
    }

    #comicContainer {
      display: flex;
      justify-content: center;
      overflow: auto;
      padding: 20px 0;
    }

    img {
      max-height: 90vh;
      height: auto;
      width: auto;
      display: block;
      cursor: pointer;
    }

    .home {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1></h1>

  <!-- Top navigation -->
  <div class="nav" id="navTop"></div>

  <div id="comicContainer">
    <a id="comicLink" href="#">
      <img id="comicImage" src="" alt="Comic page">
    </a>
  </div>

  <!-- Bottom navigation -->
  <div class="nav" id="navBottom"></div>

  <div class="home"><a href="https://www.saghaley.com">Home</a></div>

  <script>
    const totalPages = 5;
    const imagePrefix = "comic";
    const imageExt = ".webp";

    function getPageNumber() {
      const hash = window.location.hash.substring(1);
      const num = parseInt(hash);
      return (num >= 1 && num <= totalPages) ? num : 1;
    }

    function updatePage() {
      const page = getPageNumber();
      const img = document.getElementById("comicImage");
      const link = document.getElementById("comicLink");
      img.src = `${imagePrefix}${page}${imageExt}`;
      link.href = `#${page < totalPages ? page + 1 : totalPages}`;

      const backLink = page === 1
        ? `<span class="disabled">←</span>`
        : `<a href="#${page - 1}">←</a>`;

      const nextLink = page === totalPages
        ? `<span class="disabled">→</span>`
        : `<a href="#${page + 1}">→</a>`;

      const pageDisplay = `<span class="page-number">${page}</span>`;
      const navHTML = `${backLink}${pageDisplay}${nextLink}`;

      document.getElementById("navTop").innerHTML = navHTML;
      document.getElementById("navBottom").innerHTML = navHTML;
    }

    window.addEventListener("hashchange", updatePage);
    window.addEventListener("load", updatePage);
  </script>
</body>
</html>
