<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery</title>
<style>
  body {
    font-family: sans-serif;
    margin: 0;
    padding: 0;
  }

  h1 {
    text-align: center;
    margin: 24px 0;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .gallery a {
    display: block;
  }

  .gallery img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .gallery img:hover {
    transform: scale(1.03);
  }
</style>
</head>
<body>

<h1>Gallery</h1>

<div class="gallery">
