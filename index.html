<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saghaley Lewis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#4a4a4a;
      --ink2:#4a4a4a;
      --rule:#d9d9d9;
      --bg:#ffffff;
    }

    *{ box-sizing:border-box; }
    html{ scroll-behavior:smooth; }
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:"Open Sans", Arial, sans-serif;
      font-weight:300;
    }

    .wrap{
      max-width:1280px;
      margin:0 auto;
      padding:14px 22px 90px;
    }

    .top{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:24px;
      margin-bottom:8px;
    }

    .brand{
      font-size:52px;
      line-height:1;
      letter-spacing:.6px;
      color:#7f7f7f;
      margin:0;
      font-weight:300;
      position:relative;
      top:-6px;
    }

    nav{ padding-bottom:10px; }
    nav a{
      color:#8a8a8a;
      text-decoration:none;
      margin-left:22px;
      font-size:20px;
    }
    nav a:hover{ color:var(--ink); }

    .banner{
      width:100%;
      height:420px;
      overflow:hidden;
      margin:0 0 22px;
      background:#f2f2f2;
    }
    .banner video{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .section-title{
      font-size:14px;
      margin:0 0 10px;
    }

    hr{
      border:0;
      border-top:1px solid var(--rule);
      margin:0 0 22px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 400px));
      gap:26px;
      margin-bottom:24px;
    }

    .thumb{
      aspect-ratio:1/1;
      background:#f2f2f2;
      overflow:hidden;
      transition:transform 140ms ease;
    }
    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      background:#f2f2f2;
    }

    a.thumblink:hover .thumb{ transform:scale(0.97); }

    .social-links{
      display:flex;
      flex-wrap:wrap;
      gap:12px 22px;
      font-size:14px;
      margin-top:10px;
      padding:6px 8px;
      border-radius:10px;
    }

    .social-links a{
      color:var(--ink2);
      text-decoration:none;
    }
    .social-links a:hover{ color:var(--ink); }

    #contactEmail{
      display:inline-block;
      padding:6px 10px;
      border-radius:8px;
    }

    @keyframes flash{
      0%   { background:rgba(0,0,0,0.14); }
      60%  { background:rgba(0,0,0,0.06); }
      100% { background:transparent; }
    }

    .flash{
      animation:flash 900ms ease-out;
    }

    #socials{ margin-top:26px; }
    #contact{ margin-top:18px; }

    @media (max-width:900px){
      .grid{ grid-template-columns:1fr; }
    }

    @media (max-width:800px){
      .brand{ font-size:40px; top:-4px; }
      nav a{ font-size:17px; margin-left:14px; }
      .banner{ height:280px; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="top">
      <h1 class="brand">Saghaley Lewis</h1>

      <nav>
        <a href="https://ko-fi.com/saghaley/commissions" target="_blank">Commission (Closed)</a>
        <a href="https://saghaley.com/gallery/index.html" target="_blank">Works</a>
        <a id="navSocials" href="#socials">Socials</a>
        <a id="navContact" href="#contact">Contact</a>
      </nav>
    </div>

    <div class="banner">
      <video id="heroVideo" autoplay muted playsinline loop preload="auto">
        <source src="lotus.mp4" type="video/mp4">
      </video>
    </div>

    <div id="work">
      <div class="section-title">Works</div>
      <hr>
      <div class="grid">
        <a class="thumblink" href="/gallery/index.html"><div class="thumb"><img class="random-gallery" alt=""></div></a>
        <a class="thumblink" href="/gallery/index.html"><div class="thumb"><img class="random-gallery" alt=""></div></a>
        <a class="thumblink" href="/gallery/index.html"><div class="thumb"><img class="random-gallery" alt=""></div></a>
      </div>
    </div>

    <div id="recent">
      <div class="section-title">Recent</div>
      <hr>
      <script async src="https://blueskytimeline.com/timeline.js"
        data-handle="saghaley.bsky.social"
        data-theme="light"
        data-width="700"
        data-height="700"
        data-ui="2"
        data-thread="0"
        data-pin="0"
        data-rp="1"></script>
    </div>

    <div id="socials">
      <div id="socialLinks" class="social-links">
        <a href="https://www.patreon.com/Saghaley" target="_blank">Patreon</a>
        <a href="https://x.com/saghaley" target="_blank">X</a>
        <a href="https://www.instagram.com/saghaleylewis/" target="_blank">Instagram</a>
        <a href="https://bsky.app/profile/saghaley.bsky.social" target="_blank">Bluesky</a>
        <a href="https://www.youtube.com/channel/UCaLHCoQmUwkm5isVCFj76zA" target="_blank">YouTube</a>
        <a href="https://saghaleylewis.newgrounds.com/" target="_blank">Newgrounds</a>
        <a href="https://ko-fi.com/saghaley" target="_blank">Ko-fi</a>
        <a href="https://www.redbubble.com/people/nuuu-/shop?asc=u" target="_blank">Redbubble</a>
        <a href="https://discord.gg/QRfXWC8stc" target="_blank">Discord</a>
      </div>
    </div>

    <div id="contact">
      <a id="contactEmail" href="mailto:saghaley@gmail.com"
         style="font-size:14px;color:#9a9a9a;text-decoration:none;">
        saghaley@gmail.com
      </a>
    </div>

  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const images = [
      "angel.webp","glt.webp","deltarune.webp","dvwnpour.webp",
      "angelofdeath.webp","hello.webp","mots.webp","shelter.webp",
      "napple.webp","refuge.webp","secondshot.webp","fall.webp",
      "mado.webp","subway.webp","ics.webp","lake.webp"
    ];

    // Shuffle images
    const shuffled = images.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    // Assign images to thumbnails with lazy loading
    document.querySelectorAll("#work .random-gallery").forEach((img, i) => {
      img.src = shuffled[i % shuffled.length];
      img.loading = "lazy"; // lazy load
      img.width = 400;       // optional: renders smaller
      img.height = 400;
      img.onerror = () => { img.onerror = null; img.removeAttribute("src"); };
    });

    // Flash effect for socials & contact
    const flashOnce = el => { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); };

    const navSocials = document.getElementById("navSocials");
    const socialLinks = document.getElementById("socialLinks");
    if(navSocials && socialLinks) navSocials.addEventListener("click", () => setTimeout(() => flashOnce(socialLinks), 150));

    const navContact = document.getElementById("navContact");
    const email = document.getElementById("contactEmail");
    if(navContact && email) navContact.addEventListener("click", () => setTimeout(() => flashOnce(email), 150));

    // Play hero video
    const v = document.getElementById("heroVideo");
    if(v) v.play().catch(() => {});
  });
</script>

</body>
</html>
